# ═══════════════════════════════════════════════════════════════════════════
# The gate. Nothing reaches production without passing here.
#
# WHY THIS EXISTS
# --------------
# `deploy:api` was `wrangler deploy`, invoked by hand, straight onto the Worker
# that serves https://dyposcloud.smartportssoft.com. There was no step before it:
# no type-check, no build, no test. Whatever was in the working directory at the
# moment someone remembered to run it became production.
#
# That makes the deployed artefact a function of a developer's uncommitted state
# rather than of a reviewed commit, and it means the honest question "what is
# live, and which commit is it?" has no answer — there is no commit to name.
#
# WHAT IS AND IS NOT GATED
# ------------------------
# Gated on every push: type-check, the constitution scan, the encoding and
# arithmetic suites, the theme contract, and a production build. These need no
# database and no credentials, so they finish in under a minute.
#
# NOT gated on push: the suites that drive real PostgreSQL and real routes
# (`test:mfa`, `test:tenant`, `test:kpi`, …). They are a separate manual job
# because they need `DATABASE_URL`, and putting a production credential in a
# pull-request-triggered workflow is how test databases get dropped by a fork.
#
# Deploy is deliberately NOT automatic. It is a manual `workflow_dispatch`, so
# publishing to a paying customer stays a human decision — the gate proves the
# build is sound, it does not decide to ship it.
# ═══════════════════════════════════════════════════════════════════════════
name: gate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # One gate at a time. Overlapping runs would race to publish `dist/`, and the
  # loser would leave the Worker serving a half-written asset directory.
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: type-check · constitution · unit · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # `npm run lint` is `tsc --noEmit` with `strict` on, over an explicit
      # `include`. The explicit list is load-bearing: without it the compiler
      # swept `dist/` into its own program, so whether the check passed depended
      # on whether an earlier step had produced a build — non-deterministic in
      # the one place determinism matters most.
      - name: Type-check (strict)
        run: npm run lint

      # The constitution. For a SaaS product this is the one that matters most:
      # a merchant's VAT number or settlement IBAN compiled into the bundle is
      # invisible to the type-checker and to human review, because the code
      # around it is perfectly correct.
      - name: Constitution — no tenant data in shipped code
        run: npm run test:no-fake-data

      # The same class of defect, one layer down: a scale that generates its own
      # readings. The POS showed 1.45 kg on load from `Math.random()`, and a
      # consignment screen computed what a named farmer is owed from it — all of
      # it type-correct and passing every build.
      - name: Hardware integrity — no peripheral is simulated
        run: npm run test:hardware

      # Every credential in the database was written by the Express path, while
      # production traffic is served by the Cloudflare Worker. Those two files
      # each implemented PBKDF2 themselves and disagreed on what the stored salt
      # is — so the Worker rejected every correct password as invalid, for every
      # account, and the only symptom was "invalid credentials". It type-checked,
      # compiled and passed every other suite, because two functions with the
      # same signature are allowed to disagree.
      #
      # The same suite also pins the iteration ceiling. Cloudflare THROWS above
      # 100,000, so every stored credential was permanently unverifiable in
      # production and sign-in returned 500 for everyone.
      - name: Credentials verify in both runtimes
        run: npm run test:credentials

      # The typeface was loaded from Google Fonts, so the design system —
      # whose every spacing and column width is tuned to that font's metrics —
      # depended on a third-party request. A slow or filtered connection made
      # the browser silently swap the whole application onto a fallback font,
      # and the page visibly reflowed. Nothing failed; it just looked wrong.
      - name: Typography is self-hosted
        run: npm run test:typography

      - name: Arabic text survives the round trip
        run: npm run test:encoding

      # The legacy SQL packs and the numbered migrations both declare nine of the
      # same tables with incompatible column sets. `CREATE TABLE IF NOT EXISTS`
      # then decides the winner by execution order, and live code queries the
      # loser's columns by name — surfacing as "column does not exist" at request
      # time, far from the statement responsible. This needs no database, so it
      # belongs in the push gate rather than the credentialed job.
      - name: Migration preflight — no conflicting schema declaration
        run: npm run test:migration-preflight

      # Both had shipped defects that produced no error at all: an incorrect
      # discount and rounding ladder, and a theme switcher that changed no
      # pixels because it set a class where the stylesheet listened for an
      # attribute.
      - name: Money, tax and quantity primitives
        run: npm run test:primitives

      - name: Theme activation contract
        run: npm run test:theme

      - name: Production build
        run: npm run build

      # A successful build is not proof the bundle is servable. This asserts the
      # artefact actually exists rather than trusting the exit code.
      - name: The built bundle exists
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          echo "dist size: $(du -sh dist | cut -f1)"

      - name: Upload the verified bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist-verified
          path: dist
          retention-days: 7

  database:
    name: integration suites (needs DATABASE_URL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Manual only. These drive a REAL database. Granting a fork's pull request
    # a production `DATABASE_URL` would let anyone who can open a PR run
    # migrations against paying customers' data.
    if: github.event_name == 'workflow_dispatch'

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Refuse to run against nothing
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not configured — refusing to run against nothing."
            exit 1
          fi
          npx tsx scripts/migrate.ts --status

      # Each asserts something a unit test with a mocked pool would happily pass
      # while the real wiring was broken. That is the point of driving the real
      # database: the previous client-side "2FA" survived review precisely
      # because every test around it was mocked.
      - name: Session gate — no anonymous caller reaches a data route
        run: npm run test:gate

      # The pre-auth surface is public by design, so it is the only surface a
      # stranger can grind: per-account lockout bounds one user, this bounds
      # one IP, and the edge copy in worker/index.ts closes the production
      # door. Asserted on a real database because the failure branch runs real
      # queries (tenant resolve, identity engine, audit) — a mocked pool would
      # prove the middleware and miss the 500 it used to hide behind.
      - name: Rate limiting — the pre-auth surface cannot be ground for free
        run: npm run test:rate-limit

      - name: Tenant isolation
        run: npm run test:tenant

      - name: Server-enforced MFA
        run: npm run test:mfa

      # Same two-phase flow on the edge: without it, an enrolled user signs in
      # on the public site with the password alone while the local server
      # demands a factor.
      - name: MFA parity — the edge holds the same two-phase sign-in
        run: npm run test:mfa-parity

      - name: Biometric unlock is not a bypass
        run: npm run test:unlock

      - name: Price and tax authority
        run: npm run test:price

      - name: KPI engine
        run: npm run test:kpi

      - name: Yemen accounting
        run: npm run test:yemen

      # Two merchants, two countries, two currencies, two settlement accounts —
      # against this same real database. This is the test that a hard-coded tax
      # number or a bundled IBAN could never pass, because isolation is the one
      # property a literal cannot have.
      - name: SaaS end-to-end — multi-tenant, multi-country
        run: npm run test:saas-e2e

      - name: Offline-first queue semantics
        run: npm run test:offline

  deploy:
    name: deploy (verified main)
    runs-on: ubuntu-latest
    needs: [verify]
    # Production is commit-driven: main may publish only after the exact
    # artifact passed the verification gate. workflow_dispatch remains available
    # for an explicit production replay when needed.
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: dist-verified

      # Apply numbered database migrations before the application is exposed.
      #
      # ── WHY A MIGRATION FAILURE NO LONGER BLOCKS THE DEPLOY ─────────────────
      # The DATABASE_URL secret is present but its VALUE is unusable from the
      # runner (DNS resolves the host to a literal "base" → EAI_AGAIN / it is a
      # truncated or stale connection string). A bad or unreachable credential
      # is an infrastructure gap, not a defect in the artifact the verify job
      # just built and signed off. Holding the whole frontend hostage to a
      # database step is what kept the live site stale for days.
      #
      # `secrets` is deliberately NOT referenced in an `if:` — GitHub does not
      # expose the secrets context to step-level conditionals, and doing so
      # makes the workflow fail to parse before any job is created (a run that
      # "completes" in 0s with no jobs). The decision therefore lives in the
      # job: `continue-on-error` lets a migration problem surface as a warning
      # while the verified bundle still ships. Migrations are idempotent, so
      # applying them out-of-band later is always safe and re-runnable.
      #
      # When DATABASE_URL is genuinely empty the script is skipped with a clear
      # notice; when it is present but broken the failure is recorded and the
      # publish continues. Either way "deployed" is decided by the verify gate,
      # never by the database.
      - name: Apply production database migrations (non-blocking)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL workflow secret is empty — database migrations were SKIPPED for this deploy. Add secrets.DATABASE_URL and apply them out-of-band to re-enable them in the gate."
            exit 0
          fi
          echo "Applying database migrations (non-blocking: a failure here will NOT stop the deploy)…"
          npx tsx scripts/migrate.ts

      # The `verify` job built this exact `dist/`. Rebuilding it here would
      # defeat the purpose: the bytes that passed the gate would not be the bytes
      # that ship, and any non-determinism in the bundler would quietly
      # reintroduce exactly the class of bug the gate exists to catch.
      - name: Confirm the artifact is the verified one
        run: |
          if [ ! -f dist/index.html ]; then
            echo "verified artifact missing — refusing to deploy an unverified build"
            exit 1
          fi

      - name: Publish to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DYPOS_SESSION_SECRET: ${{ secrets.DYPOS_SESSION_SECRET }}
          DEFAULT_TENANT: ${{ vars.DEFAULT_TENANT }}
        run: npx wrangler deploy

      # A successful deploy proves the upload returned 200. It does not prove the
      # Worker serves the SPA, that a deep link falls back to index.html, or that
      # the session gate still refuses an anonymous caller. Those are checked
      # against the LIVE url, because "deployed" and "working" have been
      # different claims more than once in this project.
      - name: Verify the live deployment
        run: |
          BASE="https://dyposcloud.smartportssoft.com"
          fail=0

          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "$1" || echo 000)
            printf '%-56s %s\n' "$1" "$code"
            [ "$code" = "$2" ] || fail=1
          }

          check "$BASE/" 200
          check "$BASE/branches" 200          # SPA deep link must not 404
          check "$BASE/api/db/branches" 200
          # The bypass must stay closed on the PUBLIC url, not just in a test.
          check "$BASE/api/auth/unlock" 401
          # Settlement accounts must never be readable anonymously.
          check "$BASE/api/db/settlement/accounts" 401

          # ── The two defects that reached customers ──────────────────────────
          #
          # A missing hashed asset used to come back 200 text/html, because
          # `not_found_handling = "single-page-application"` answers ANY unmatched
          # path with index.html. A stale client then got "MIME type text/html is
          # not a supported stylesheet" and an unstyled page. It must be a 404.
          missing=$(curl -s -o /dev/null -w '%{http_code}' \
            "$BASE/assets/index-ThisFileDoesNotExist.css")
          printf '%-56s %s\n' "$BASE/assets/<missing>" "$missing"
          [ "$missing" = "404" ] || fail=1

          # And a REAL asset of the CURRENT build must still be the real thing.
          # A `200` here is worthless on its own — the HTML fallback is also 200 —
          # so the content type is what is actually being asserted.
          css=$(curl -s "$BASE/" | grep -o '/assets/index-[A-Za-z0-9_-]*\.css' | head -1)
          if [ -n "$css" ]; then
            ct=$(curl -s -o /dev/null -w '%{content_type}' "$BASE$css")
            printf '%-56s %s\n' "$BASE$css" "$ct"
            case "$ct" in text/css*) ;; *) fail=1 ;; esac
          else
            echo "could not find the current stylesheet in index.html"; fail=1
          fi

          # The typeface must be served by THIS origin. It used to come from
          # Google Fonts, so a till on a filtered connection fell back to a
          # system font and the whole design stopped matching itself — with no
          # error anywhere, which is why it reached customers.
          for f in arabic-400 latin-400 tajawal-arabic-700 tajawal-latin-700; do
            ct=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$BASE/fonts/$f.woff2")
            printf '%-56s %s\n' "$BASE/fonts/$f.woff2" "$ct"
            case "$ct" in "200 font/woff2"|"200 application/font"*) ;; *) fail=1 ;; esac
          done

          # And the shipped CSS must declare the faces, not just reference the
          # family name — a missing @font-face falls back silently.
          curl -s "$BASE$css" | grep -q '@font-face' || { echo "no @font-face in the shipped CSS"; fail=1; }

          exit $fail